name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Build decision
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for build-impacting changes
        id: filter
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/develop" && "${GITHUB_BASE_REF:-}" != "develop" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build required outside develop."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            if ! git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null || ! git cat-file -e "${PR_HEAD_SHA}^{commit}" 2>/dev/null; then
              echo "build=true" >> "$GITHUB_OUTPUT"
              echo "Build required because the pull request range is unavailable."
              exit 0
            fi
            mapfile -t changed_files < <(git diff --name-only "${PR_BASE_SHA}...${PR_HEAD_SHA}")
          elif [[ -n "${BEFORE_SHA:-}" && ! "${BEFORE_SHA}" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            mapfile -t changed_files < <(git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}")
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Build required because the previous revision is unavailable."
            exit 0
          fi

          build=false
          for file in "${changed_files[@]}"; do
            case "$file" in
              *.c|*.cc|*.cpp|*.cxx|*.h|*.hh|*.hpp|*.hxx|*.cs|*.csproj|*.sln|*.slnx|\
              *.js|*.jsx|*.mjs|*.cjs|*.ts|*.tsx|*.json|*.jsonc|*.yaml|*.yml|\
              *.cmake|*.css|*.html|*.xml|*.py|*.sh|*.toml|*.lock|*.rsp|*.dockerignore|\
              CMakeLists.txt|*/CMakeLists.txt|Makefile|*/Makefile|Dockerfile|*/Dockerfile|\
              Caddyfile|*/Caddyfile|_headers|*/_headers|.gitmodules|third_party/*|\
              assets/*|romfs/*|icon.*)
                build=true
                echo "Build required by: $file"
                break
                ;;
            esac
          done

          echo "build=$build" >> "$GITHUB_OUTPUT"
          if [[ "$build" == "false" ]]; then
            echo "No build-impacting changes on develop; build jobs will be skipped."
          fi

  portable-tests:
    name: Portable C++ tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes libmbedtls-dev libzstd-dev libcurl4-openssl-dev libjansson-dev
      - name: Configure tests
        run: cmake -S tests -B build/tests
      - name: Build tests
        run: cmake --build build/tests --parallel
      - name: Run tests
        run: ctest --test-dir build/tests --output-on-failure

  pairing-service:
    name: Pairing service build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  worker-and-site:
    name: Worker and public site
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Check Worker types
        working-directory: worker
        run: npm ci && npm run check
      - name: Check required public pages
        run: |
          test -f site/index.html
          test -f site/privacy/index.html
          test -f site/terms/index.html
          test -f site/_headers

  home-storage:
    name: Home Storage build and tests
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Test in the .NET 10 SDK container stage
        run: docker build --target test --tag switch-drive-home-storage-tests home-storage
      - name: Smoke test the runtime container
        run: |
          mkdir -p /tmp/home-storage-library
          docker build --target final --tag switch-drive-home-storage home-storage
          docker run --detach --name home-storage-smoke --publish 18080:8080 --env SETUP_TOKEN=ci-only-placeholder --volume /tmp/home-storage-library:/library:ro switch-drive-home-storage
          trap 'docker rm --force home-storage-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            if [ "$attempt" = 30 ]; then docker logs home-storage-smoke; exit 1; fi
            sleep 1
          done
          docker rm --force home-storage-smoke
          trap - EXIT
      - name: Validate Compose
        working-directory: home-storage
        env:
          HOST_LIBRARY_PATH: /tmp
          SETUP_TOKEN: ci-only-placeholder
          CLOUDFLARE_TUNNEL_TOKEN: ci-only-placeholder
        run: docker compose config --quiet

  switch-client:
    name: Switch client build
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build NRO with devkitPro
        run: |
          docker run --rm --user root \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            devkitpro/devkita64:latest \
            bash -lc 'make'
      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: switch-drive-nro
          path: switch-drive.nro
          if-no-files-found: error

  switch-client-release:
    name: Publish Switch client release
    needs: switch-client
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for a new client version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -nE 's/^[[:space:]]*project\(switch_drive[[:space:]]+VERSION[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unable to read a semantic client version from CMakeLists.txt" >&2
            exit 1
          fi

          latest_version="$(git tag --list | sed -nE '/^[0-9]+\.[0-9]+\.[0-9]+$/p' | sort -V | tail -n 1)"
          publish=false
          if [[ -z "$latest_version" ]]; then
            publish=true
          elif [[ "$version" == "$latest_version" ]]; then
            echo "Version $version is already tagged; no release is needed."
          elif [[ "$(printf '%s\n' "$latest_version" "$version" | sort -V | tail -n 1)" == "$version" ]]; then
            publish=true
          else
            echo "Version $version is not newer than the current version $latest_version; no release will be created."
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Download built NRO
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: switch-drive-nro
          path: release
      - name: Create tag and latest release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mv release/switch-drive.nro "release/switch-drive-${VERSION}.nro"
          gh release create "$VERSION" \
            "release/switch-drive-${VERSION}.nro#Switch Drive ${VERSION} (NRO)" \
            --target "$GITHUB_SHA" \
            --title "Switch Drive ${VERSION}" \
            --generate-notes \
            --latest
