services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: switch_drive
      POSTGRES_USER: switch_drive
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switch_drive -d switch_drive"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./server
    env_file: ./server/.env
    environment:
      DATABASE_URL: postgresql://switch_drive:${POSTGRES_PASSWORD}@postgres:5432/switch_drive
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in server/.env}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
